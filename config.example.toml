# Скопируй в config.toml и впиши свой ключ x-api-key от Kintaro API
state_dir = "state"
max_parallel_accounts = 2

[api]
base_url = "https://service.kintaroapi.com"
api_key = "" # Оставь пустым здесь, если передаёшь через env KINTARO_API_KEY
timeout_seconds = 120.0
max_retries = 3
retry_backoff_seconds = 2.5
save_raw_responses = true
raw_logs_dir = "state/raw_logs"

[warmup]
enabled = true
# Не заливать в первую минуту после свежего входа на новое устройство
min_session_age_minutes_before_first_post = 30.0
# Минимальный интервал между постами на одном аккаунте
min_hours_between_posts_per_account = 3.0
# Безопасный суточный лимит постов на один аккаунт
max_posts_per_account_per_day = 3
# Параметры органического просмотра ленты перед заливом
feed_rounds_min = 2
feed_rounds_max = 4
views_per_round_min = 3
views_per_round_max = 7
playtime_ms_min = 4200
playtime_ms_max = 19500
like_probability = 0.12
read_comments_probability = 0.18
follow_probability = 0.03
action_delay_seconds_min = 2.0
action_delay_seconds_max = 6.5
pre_upload_pause_seconds_min = 5.0
pre_upload_pause_seconds_max = 15.0

[uniquifier]
enabled = true
ffmpeg_bin = "ffmpeg"
ffprobe_bin = "ffprobe"
temp_dir = "state/tmp_media"
crop_ratio_min = 0.985
crop_ratio_max = 0.996
brightness_shift_max = 0.018
contrast_shift_max = 0.025
saturation_shift_max = 0.03
speed_jitter_max = 0.015
video_crf_min = 19
video_crf_max = 22
photo_jpeg_quality_min = 90
photo_jpeg_quality_max = 96

[response_mapping]
# В kintaro-api.json схемы ответов 200/403 описаны как нетипизированный object.
# Если в твоём билде Kintaro ключи отличаются, поправь их здесь без изменения кода:
device_keys = ["device", "x_device", "x-device", "data.device"]
verify_keys = ["verify", "data.verify", "challenge"]
feed_list_keys = ["aweme_list", "data.aweme_list", "items", "data.items", "posts", "data.posts"]
aweme_id_keys = ["aweme_id", "data.aweme_id", "aweme.aweme_id", "data.aweme.aweme_id", "post.aweme_id", "item_id"]
play_count_keys = ["statistics.play_count", "stats.playCount", "play_count", "views"]
