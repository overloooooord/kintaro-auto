[project]
name = "kintaro-auto"
version = "0.1.0"
description = "Full multi-account TikTok upload & anti-shadowban automation for Kintaro API v1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx[socks]>=0.27.0",
    "pillow>=11.0.0",
    "playwright>=1.65.2",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.34",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kintaro-auto = "kintaro_auto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kintaro_auto"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
